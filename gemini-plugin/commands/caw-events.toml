description = "ある企業の就活イベントを深掘り＋過去実績から今年度を予測（就活・複数社は明示指示時）"
prompt = "GEMINI.md の『caw-events』手順に従う。**既定で 1 社**の就活イベント（インターン・説明会・座談会・選考）と締切を深掘り収集し、過去 2〜3 年の実績から今年度の開催を予測（「予測（昨年実績ベース）」と明示し根拠の実日付を併記、確定情報と峻別・捏造しない）。公式採用ページを最優先に就活サイト（マイナビ/リクナビ/ワンキャリア 等）も積極併用、食い違いは公式優先＋出典明記。出典をクリックで開ける HTML work/recruit/<企業>_<日付>.html（イベントカタログ/年間予測カレンダー/過去×今年度対照表、全項目に出典リンク＋取得日）を既定の成果物に（md は任意）、確定/予測をバッジ区別、未取得は『要確認』。締切は秘書の選考スケジュールへ連携。複数社・業界横断はユーザーが明示指示したときだけ。対象企業: {{args}}"
