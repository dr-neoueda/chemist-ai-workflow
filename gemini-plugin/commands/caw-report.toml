description = "開発者向けの匿名動作レポートを生成する（PII・案件内容を含まない）"
prompt = "GEMINI.md の『caw-report』手順に従う。テストユーザー環境の構造健全性・利用状況（件数）・エラー種別を、個人情報・案件内容・ファイル名・本文・絶対パスを一切含めずに caw-report/<日付>.md に生成し、保存前に自己点検して PII が無いことを確認する。出せるのは標準フォルダ名・件数・合否・エラー種別・version/CLI/トラック/モードのみ。生成後は提出先フォームの URL（https://docs.google.com/forms/d/e/1FAIpQLScvql2d5wA2GiCeGjXuX5172sjvwX4tQ2bFfXE19vvqYLA9vQ/viewform ）をチャットに表示し、レポートの中身を貼り付けて提出するよう案内する。{{args}}"
