description = "調べる：論文検索（研究）／企業・業界研究（就活）"
prompt = "GEMINI.md の『caw-research』手順に従う。office/GEMINI.md 冒頭の > トラック: で分岐。研究＝関心テーマの論文を検索し work/topics/<topic>_<YYYYMMDD>_n<件数>.html にクリック可能な HTML リスト化（登録済み work/papers/ は既定で除外、入手 PDF の登録は caw-register）。就活＝まず必ず調査レベル（L1/L2/L3）と出力形式（md/HTML/両方、md 推奨）を尋ねてから汎用 8 ブロックで work/companies/<企業>.md に整理（非公式情報は複数ソースで裏取り）。L3 では有報・決算説明会資料・統合報告書等の公式開示文書を IR から自分で取得（PDF は curl→pdftotext で必要箇所抽出、Gemini は直読み可）して反映、出典に PDF URL＋取得日、取れなければ貼り付け依頼・捏造しない。対象: {{args}}"
